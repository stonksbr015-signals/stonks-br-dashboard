<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Stonks BR Signals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0f19;
      color: #ffffff;
    }

    header {
      background: #11162a;
      padding: 20px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #151a30;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    .pair {
      font-size: 22px;
      font-weight: bold;
    }

    .direction {
      margin-top: 5px;
      font-weight: bold;
    }

    .long {
      color: #00ff9c;
    }

    .short {
      color: #ff4d4d;
    }

    .price {
      font-size: 26px;
      margin: 10px 0;
    }

    .indicators {
      margin-top: 10px;
    }

    .indicator {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .ok {
      color: #00ff9c;
    }

    .no {
      color: #ff4d4d;
    }

    footer {
      text-align: center;
      padding: 15px;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<header>
  STONKS BR – CRYPTO SIGNALS
</header>

<div class="container">

  <!-- BTC -->
  <div class="card">
    <div class="pair">BTCUSDT</div>
    <div class="direction long">LONG</div>
    <div class="price" id="btc-price">Carregando...</div>

    <div class="indicators">
      <div class="indicator">RSI <span class="ok">✅</span></div>
      <div class="indicator">EMA <span class="no">❌</span></div>
      <div class="indicator">Bollinger <span class="ok">✅</span></div>
    </div>
  </div>

  <!-- ETH -->
  <div class="card">
    <div class="pair">ETHUSDT</div>
    <div class="direction short">SHORT</div>
    <div class="price" id="eth-price">Carregando...</div>

    <div class="indicators">
      <div class="indicator">RSI <span class="ok">✅</span></div>
      <div class="indicator">EMA <span class="ok">✅</span></div>
      <div class="indicator">Bollinger <span class="ok">✅</span></div>
    </div>
  </div>

  <!-- SOL -->
  <div class="card">
    <div class="pair">SOLUSDT</div>
    <div class="direction long">LONG</div>
    <div class="price" id="sol-price">Carregando...</div>

    <div class="indicators">
      <div class="indicator">RSI <span class="no">❌</span></div>
      <div class="indicator">EMA <span class="ok">✅</span></div>
      <div class="indicator">Bollinger <span class="ok">✅</span></div>
    </div>
  </div>

</div>

<footer>
  Dados de preço via Binance API • Atualização automática
</footer>

<script>
async function atualizarPreco(symbol, elementId) {
  try {
    const res = await fetch(
      "https://api.binance.com/api/v3/ticker/price?symbol=" + symbol
    );
    const data = await res.json();
    document.getElementById(elementId).innerText =
      "$ " + parseFloat(data.price).toFixed(2);
  } catch (e) {
    document.getElementById(elementId).innerText = "Erro";
  }
}

setInterval(() => {
  atualizarPreco("BTCUSDT", "btc-price");
  atualizarPreco("ETHUSDT", "eth-price");
  atualizarPreco("SOLUSDT", "sol-price");
}, 3000);
</script>

</body>
</html>
