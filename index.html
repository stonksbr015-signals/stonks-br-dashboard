<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>STONKS BR - Crypto Signals</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f1a;
  color: #fff;
}

header {
  text-align: center;
  padding: 20px;
}

header img {
  width: 120px;
}

h1 {
  margin-top: 10px;
}

#ranking {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 15px;
  padding: 20px;
}

.card {
  background: #131a2a;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 0 12px rgba(0,0,0,0.5);
}

.long { color: #00ff9d; }
.short { color: #ff4d4d; }

footer {
  text-align: center;
  font-size: 12px;
  padding: 20px;
  opacity: 0.7;
}
</style>
</head>

<body>

<header>
  <img src="https://raw.githubusercontent.com/stonksbr015-signals/stonks-br-dashboard/main/logo.png">
  <h1>STONKS BR - Crypto Signals</h1>
  <p>Dados em tempo real da Binance</p>
</header>

<section id="ranking"></section>

<footer>
STONKS BR - Crypto Signals<br>
Desenvolvido para a comunidade BR.<br>
Todos os direitos reservados © 2026
</footer>

<script>
const rankingDiv = document.getElementById("ranking");

// --- FUNÇÕES DE INDICADORES ---

function EMA(prices, period) {
  const k = 2 / (period + 1);
  let ema = prices[0];
  prices.forEach(price => {
    ema = price * k + ema * (1 - k);
  });
  return ema;
}

function RSI(prices, period = 14) {
  let gains = 0, losses = 0;
  for (let i = prices.length - period; i < prices.length - 1; i++) {
    const diff = prices[i + 1] - prices[i];
    if (diff >= 0) gains += diff;
    else losses -= diff;
  }
  const rs = gains / (losses || 1);
  return 100 - (100 / (1 + rs));
}

function Bollinger(prices, period = 20) {
  const slice = prices.slice(-period);
  const avg = slice.reduce((a,b)=>a+b)/period;
  const variance = slice.reduce((a,b)=>a+(b-avg)**2,0)/period;
  const std = Math.sqrt(variance);
  return {
    upper: avg + 2 * std,
    lower: avg - 2 * std
  };
}

// --- BINANCE TOP 100 ---

fetch("https://api.binance.com/api/v3/ticker/24hr")
.then(res => res.json())
.then(markets => {

  const top100 = markets
    .filter(m => m.symbol.endsWith("USDT"))
    .sort((a,b) => b.quoteVolume - a.quoteVolume)
    .slice(0, 100);

  top100.slice(0,3).forEach(market => {
    loadCoin(market.symbol);
  });

});

function loadCoin(symbol) {

  fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=15m&limit=100`)
  .then(res => res.json())
  .then(data => {

    const closes = data.map(c => parseFloat(c[4]));
    const price = closes.at(-1);

    const ema9 = EMA(closes.slice(-9), 9);
    const ema21 = EMA(closes.slice(-21), 21);
    const rsi = RSI(closes);
    const bb = Bollinger(closes);

    let direction = "NEUTRO";
    let score = 50;

    if (ema9 > ema21 && rsi < 70 && price < bb.upper) {
      direction = "LONG";
      score = 85;
    }

    if (ema9 < ema21 && rsi > 30 && price > bb.lower) {
      direction = "SHORT";
      score = 82;
    }

    const stop = direction === "LONG"
      ? (price * 0.985).toFixed(2)
      : (price * 1.015).toFixed(2);

    const take = direction === "LONG"
      ? (price * 1.03).toFixed(2)
      : (price * 0.97).toFixed(2);

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>${symbol}</h3>
      <p class="${direction === "LONG" ? "long" : "short"}">${direction}</p>
      <p>Preço: ${price}</p>
      <p>Entrada: ${price}</p>
      <p>Stop: ${stop}</p>
      <p>Take: ${take}</p>
      <p>RSI: ${rsi.toFixed(1)}</p>
      <p>Score: ${score}%</p>
    `;

    rankingDiv.appendChild(card);
  });
}
</script>

</body>
</html>
