<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>STONKS BR - Crypto Signals</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- Chart.js para os mini-gráficos -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0a0f1a;

}

  text-align: center;

  margin: 6px 0;

  margin: 0;

}

  max-width: 1200px;
  margin:auto;
  padding: 20px;
}
#ranking {
  display: grid;
  gap: 18px;
  grid-template-columns: repeat(auto-fit, minmax(290px,1fr));
}

  background: rgba(255,255,255,0.05);
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.4);
}

  margin: 0 0 8px 0;
}

  display:flex;
  justify-content:space-between;

}

}

}

}

<body>

<header>
  <h1>🚀 STONKS BR – Crypto Signals</h1>
  <p>Ranking Top 100 (Binance), Multi-Indicadores, Probabilidade & Notícias em Tempo Real</p>
</header>

<div class="container">
  <section id="ranking"></section>

  <div class="news-section">
    <h2>📰 Notícias Cripto (3 fontes)</h2>
    <ul id="news"></ul>
  </div>
</div>

<footer>
📌 Este dashboard é apenas para **monitoramento** — não é recomendação de investimento.  
Desenvolvido para a comunidade BR • © 2026 STONKS BR
</footer>

<script>
/* —————————————————————————————
   INDICADORES TÉCNICOS (REAIS)
————————————————————————————— */

function EMA(prices, period) {
  const k = 2 / (period + 1);
  let ema = prices[0];
  prices.forEach(p => ema = p*k + ema*(1-k));
  return ema;
}

function RSI(prices, period=14) {
  let gains=0, losses=0;
  for (let i = prices.length - period; i < prices.length - 1; i++) {
    const diff = prices[i+1] - prices[i];
    if (diff >= 0) gains += diff;
    else losses -= diff;
  }
  const rs = gains / (losses||1);
  return 100 - (100 / (1 + rs));
}

function Bollinger(prices, period=20) {
  const slice = prices.slice(-period);
  const mean = slice.reduce((a,b)=>a+b,0)/period;
  const variance = slice.reduce((a,b)=>a+(b-mean)**2,0)/period;
  const std = Math.sqrt(variance);
  return {upper: mean+2*std, lower: mean-2*std, middle: mean};
}

// —————————————————————————————
// RANKING TOP 100 BINANCE
// —————————————————————————————

fetch("https://api.binance.com/api/v3/ticker/24hr")
.then(r => r.json())
.then(all => {

  const top100 = all
    .filter(m=>m.symbol.endsWith("USDT"))
    .sort((a,b)=>b.quoteVolume - a.quoteVolume)
    .slice(0,100);

  // Cálculo técnico e probabilidade
  top100.forEach(m => analyzePair(m.symbol));

});

function analyzePair(symbol) {
  fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=15m&limit=100`)
  .then(r=>r.json())
  .then(data => {
    const closes = data.map(c=>+c[4]);
    const price = closes.at(-1);

    const ema9 = EMA(closes.slice(-9),9);
    const ema21 = EMA(closes.slice(-21),21);
    const rsiVal = RSI(closes);
    const bb = Bollinger(closes);

    const emaOk = ema9 > ema21;
    const rsiOk = rsiVal>=40 && rsiVal<=60;
    const bbOk = price>=bb.lower && price<=bb.upper;

    let score = 0;
    if (emaOk) score += 30;
    if (rsiOk) score += 30;
    if (bbOk) score += 30;
    if (price > ema21) score += 10;

    const direction = score >= 60 ? "LONG" : "SHORT";

    ranking(symbol, price, direction, score, {
      emaOk, rsiOk, bbOk
    });
  });
}

let builtCards = [];
function ranking(symbol, price, direction, score, flags) {
  builtCards.push({symbol, price, direction, score, flags});
  builtCards.sort((a,b)=>b.score - a.score);

  if (builtCards.length >= 3) updateUI(builtCards.slice(0,3));
}

function updateUI(top3) {
  const rankingDiv = document.getElementById("ranking");
  rankingDiv.innerHTML = "";

  top3.forEach(item => {
    const div = document.createElement("div");
    div.className = "card";

    const {symbol, price, direction, score, flags} = item;

    div.innerHTML = `
      <h3>${symbol} (${score}%)</h3>
      <p class="${direction==="LONG"? "ok":"no"}">${direction}</p>
      <p>Preço: $${price.toFixed(2)}</p>

      <div class="indicator">EMA 9/21 <span class="${flags.emaOk? "ok":"no"}">${flags.emaOk? "✔️":"❌"}</span></div>
      <div class="indicator">RSI (40–60) <span class="${flags.rsiOk? "ok":"no"}">${flags.rsiOk? "✔️":"❌"}</span></div>
      <div class="indicator">Bollinger <span class="${flags.bbOk? "ok":"no"}">${flags.bbOk? "✔️":"❌"}</span></div>

      <p><b>Entrada:</b> $${price.toFixed(2)}</p>
      <p><b>Stop Limit:</b> $${(price*0.99).toFixed(2)}</p>
      <p><b>Take Profit:</b> $${(price*1.02).toFixed(2)}</p>
      <div class="chart-container"><canvas id="chart_${symbol}"></canvas></div>
    `;
    rankingDiv.appendChild(div);

    drawMiniChart(`chart_${symbol}`, symbol);
  });
}

function drawMiniChart(id, symbol) {
  fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=15m&limit=50`)
  .then(r=>r.json())
  .then(data=>{
    const closes = data.map(c=>+c[4]);
    new Chart(document.getElementById(id),{
      type:'line',
      data:{
        labels: closes.map((_,i)=>i),
        datasets:[{data:closes,borderColor:'#00ff9d',borderWidth:1,pointRadius:0}]
      },
      options:{plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}}}
    });
  });
}

// —————————————————————————————
// TRÊS FONTES DE NOTÍCIAS
// —————————————————————————————

const newsList = document.getElementById("news");

function addNews(title, url) {
  const li = document.createElement("li");
  li.innerHTML = `<a href="${url}" target="_blank">${title}</a>`;
  newsList.appendChild(li);
}

// Fonte 1 – CryptoPanic (pública)
fetch("https://cryptopanic.com/api/v1/posts/?auth_token=demo&public=true")
.then(r=>r.json())
.then(json => {
  json.results.slice(0,3).forEach(n=> addNews(n.title, n.url));
});

// Fonte 2 – CoinGecko News
fetch("https://api.coingecko.com/api/v3/news")
.then(r=>r.json())
.then(json => {
  json.data.slice(0,3).forEach(n=> addNews(n.title, n.url));
});

// Fonte 3 – Cryptocompare RSS
fetch("https://min-api.cryptocompare.com/data/v2/news/")
.then(r=>r.json())
.then(json => {
  json.Data.slice(0,3).forEach(n=> addNews(n.title, n.url));
})
.catch(()=> addNews("Não foi possível carregar Cryptocompare","https://cryptocompare.com"));
</script>
