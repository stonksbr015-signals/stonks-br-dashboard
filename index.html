<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>STONKS BR - Crypto Signals</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: radial-gradient(circle at top, #0b1020, #020617);
  color: #e5e7eb;
}

header {
  text-align: center;
  padding: 25px;
}

header h1 {
  margin: 10px 0;
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
  gap: 20px;
}

.card {
  background: rgba(255,255,255,0.06);
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 0 20px rgba(0,0,0,.4);
}

.long { color: #22c55e; }
.short { color: #ef4444; }

.price {
  font-size: 22px;
  margin: 10px 0;
}

.chart {
  height: 100px;
  background: linear-gradient(135deg,#1e293b,#020617);
  border-radius: 10px;
  margin: 10px 0;
}

.section {
  margin-top: 50px;
}

.news li {
  margin-bottom: 10px;
}

footer {
  margin-top: 60px;
  padding: 20px;
  text-align: center;
  font-size: 14px;
  opacity: .7;
}
</style>
</head>

<body>

<header>
  <h1>🚀 STONKS BR - Crypto Signals</h1>
  <p>Binance Futures • Tempo Real • Comunidade BR</p>
</header>

<div class="container">

<h2>🔥 TOP 3 OPORTUNIDADES (Binance)</h2>
<div class="cards" id="cards"></div>

<div class="section">
<h2>📰 Notícias Cripto (Automático)</h2>
<ul class="news" id="news"></ul>
</div>

</div>

<footer>
STONKS BR - Crypto Signals • Desenvolvido para a comunidade BR  
<br>Todos os direitos reservados © 2026
</footer>

<script>
const symbols = ["BTCUSDT","ETHUSDT","SOLUSDT"];
const cards = document.getElementById("cards");

// Criar cards
symbols.forEach(sym => {
  const div = document.createElement("div");
  div.className = "card";
  div.id = sym;
  div.innerHTML = `
    <h3>${sym}</h3>
    <div class="price">--</div>
    <div class="chart"></div>
    <div class="signal"></div>
    <div class="risk"></div>
    <p>Telegram ✅ | Discord ✅</p>
  `;
  cards.appendChild(div);
});

// Binance WebSocket
const ws = new WebSocket("wss://stream.binance.com:9443/ws/!ticker@arr");

ws.onmessage = (event) => {
  const data = JSON.parse(event.data);
  data.forEach(t => {
    if (symbols.includes(t.s)) {
      const price = parseFloat(t.c);
      const change = parseFloat(t.P);
      const direction = change >= 0 ? "LONG" : "SHORT";
      const entry = price;
      const stop = (price * 0.99).toFixed(2);
      const take = (price * 1.02).toFixed(2);

      document.querySelector(`#${t.s} .price`).innerHTML =
        `Preço: $${price.toFixed(2)} (${change}%)`;

      document.querySelector(`#${t.s} .signal`).innerHTML =
        `Direção: <b class="${direction === "LONG" ? "long":"short"}">${direction}</b>`;

      document.querySelector(`#${t.s} .risk`).innerHTML =
        `Entrada: ${entry.toFixed(2)}<br>Stop: ${stop}<br>Take: ${take}`;
    }
  });
};

// Notícias (CoinGecko)
fetch("https://api.coingecko.com/api/v3/news")
.then(r => r.json())
.then(n => {
  n.data.slice(0,5).forEach(item => {
    const li = document.createElement("li");
    li.innerHTML = `<a href="${item.url}" target="_blank">${item.title}</a>`;
    document.getElementById("news").appendChild(li);
  });
})
.catch(() => {
  document.getElementById("news").innerHTML =
    "<li>Não foi possível carregar notícias agora.</li>";
});
</script>

</body>
</html>
