<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Stonks BR - Crypto Signals</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0e1117;
      color: #eaeaea;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111827;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: #161b22;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    .pair {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .indicator {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
    }

    .ok {
      color: #00ff9c;
    }

    .no {
      color: #ff4d4d;
    }

    .footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

<header>STONKS BR - CRYPTO SIGNALS</header>

<div class="container" id="cards"></div>

<div class="footer">
  Dados reais da Binance Futures • Atualização automática
</div>

<script>
const PAIRS = ["BTCUSDT", "ETHUSDT", "SOLUSDT"];
const INTERVAL = "15m";
const LIMIT = 100;

/* ================= BINANCE ================= */

async function getCandles(symbol) {
  const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${INTERVAL}&limit=${LIMIT}`;
  const res = await fetch(url);
  const data = await res.json();
  return data.map(c => parseFloat(c[4]));
}

/* ================= INDICADORES ================= */

function ema(prices, period) {
  const k = 2 / (period + 1);
  let ema = prices[0];
  for (let i = 1; i < prices.length; i++) {
    ema = prices[i] * k + ema * (1 - k);
  }
  return ema;
}

function rsi(prices, period = 14) {
  let gains = 0, losses = 0;
  for (let i = prices.length - period - 1; i < prices.length - 1; i++) {
    const diff = prices[i + 1] - prices[i];
    diff >= 0 ? gains += diff : losses -= diff;
  }
  if (losses === 0) return 100;
  const rs = gains / losses;
  return 100 - (100 / (1 + rs));
}

function bollinger(prices, period = 20, mult = 2) {
  const slice = prices.slice(-period);
  const mean = slice.reduce((a,b) => a+b, 0) / period;
  const variance = slice.reduce((a,b) => a + Math.pow(b - mean, 2), 0) / period;
  const std = Math.sqrt(variance);
  return {
    middle: mean,
    upper: mean + mult * std,
    lower: mean - mult * std
  };
}

/* ================= DASHBOARD ================= */

async function render() {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  for (const pair of PAIRS) {
    const prices = await getCandles(pair);
    const price = prices[prices.length - 1];

    const ema9 = ema(prices, 9);
    const ema21 = ema(prices, 21);
    const rsiVal = rsi(prices);
    const bb = bollinger(prices);

    const emaOk = ema9 > ema21;
    const rsiOk = rsiVal >= 40 && rsiVal <= 60;
    const bbOk = price >= bb.middle * 0.995 && price <= bb.middle * 1.005;

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="pair">${pair}</div>

      <div class="indicator">
        <span>EMA 9 / EMA 21</span>
        <span class="${emaOk ? "ok" : "no"}">${emaOk ? "✅" : "❌"}</span>
      </div>

      <div class="indicator">
        <span>RSI (${rsiVal.toFixed(1)})</span>
        <span class="${rsiOk ? "ok" : "no"}">${rsiOk ? "✅" : "❌"}</span>
      </div>

      <div class="indicator">
        <span>Bollinger (média)</span>
        <span class="${bbOk ? "ok" : "no"}">${bbOk ? "✅" : "❌"}</span>
      </div>
    `;

    container.appendChild(card);
  }
}

render();
setInterval(render, 60000); // atualiza a cada 1 min
</script>

</body>
</html>
