<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Stonks BR – Crypto Signals</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f1a;
  color: #fff;
}
header {
  padding: 20px;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  background: #11162a;
}
.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 20px;
  flex-wrap: wrap;
}
.card {
  background: #161c34;
  border-radius: 10px;
  padding: 20px;
  width: 300px;
}
.card h2 {
  margin: 0 0 10px;
}
.price {
  font-size: 22px;
  margin-bottom: 10px;
}
.indicator {
  display: flex;
  justify-content: space-between;
  margin: 5px 0;
}
.ok { color: #00ff99; }
.no { color: #ff4d4d; }
.confirmed {
  margin-top: 10px;
  padding: 10px;
  text-align: center;
  border-radius: 5px;
  font-weight: bold;
}
.confirmed.ok { background: #00ff9933; }
.confirmed.no { background: #ff4d4d33; }
</style>
</head>

<body>

<header>STONKS BR – CRYPTO SIGNALS</header>

<div class="container" id="cards"></div>

<script>
const TELEGRAM_TOKEN = "8428715092:AAHNhuEd2XeN3c_Yt2e9rHazVe81sUWRhws";
const TELEGRAM_CHAT_ID = "8411881382";
const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1468944689288712285/HBBK3RY7yZzhcqCe0i29pkmRVvAmNoKfnRPmZi5ay70zDMtuOQRyVxKt3JH7vmOglyyM";

const pairs = ["BTCUSDT", "ETHUSDT", "SOLUSDT"];
let sentSignals = {};

function sendTelegram(msg) {
  if (!TELEGRAM_TOKEN || !TELEGRAM_CHAT_ID) return;
  fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: msg })
  });
}

function sendDiscord(msg) {
  if (!DISCORD_WEBHOOK) return;
  fetch(DISCORD_WEBHOOK, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ content: msg })
  });
}

async function fetchPrice(symbol) {
  const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
  const data = await res.json();
  return parseFloat(data.price);
}

function randomBool() {
  return Math.random() > 0.5;
}

async function render() {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  for (const pair of pairs) {
    const price = await fetchPrice(pair);

    // MOCK dos indicadores (próximo passo: reais)
    const emaOk = randomBool();
    const rsiOk = randomBool();
    const bbOk = randomBool();

    const allOk = emaOk && rsiOk && bbOk;

    if (allOk && !sentSignals[pair]) {
      const msg =
`🚀 STONKS BR SIGNAL CONFIRMADO 🚀

Par: ${pair}
Preço: ${price.toFixed(2)}

✅ EMA
✅ RSI
✅ Bollinger

🎯 Setup 100% confirmado`;

      sendTelegram(msg);
      sendDiscord(msg);
      sentSignals[pair] = true;
    }

    if (!allOk) sentSignals[pair] = false;

    container.innerHTML += `
      <div class="card">
        <h2>${pair}</h2>
        <div class="price">$ ${price.toFixed(2)}</div>

        <div class="indicator">EMA <span class="${emaOk ? "ok" : "no"}">${emaOk ? "✅" : "❌"}</span></div>
        <div class="indicator">RSI <span class="${rsiOk ? "ok" : "no"}">${rsiOk ? "✅" : "❌"}</span></div>
        <div class="indicator">Bollinger <span class="${bbOk ? "ok" : "no"}">${bbOk ? "✅" : "❌"}</span></div>

        <div class="confirmed ${allOk ? "ok" : "no"}">
          ${allOk ? "SETUP CONFIRMADO" : "AGUARDANDO CONFLUÊNCIA"}
        </div>
      </div>
    `;
  }
}

render();
setInterval(render, 60000);
</script>

</body>
</html>
